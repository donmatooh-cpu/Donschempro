<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donschempro</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0e1429;color:#fff;max-width:500px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden}.banner{background:linear-gradient(90deg,#4a6cf7,#7a8cff);height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 10px}.header{height:48px;background:#151b2e;display:flex;justify-content:space-between;align-items:center;padding:0 8px}.tabs{height:38px;display:flex;gap:5px;padding:5px 8px}.tab{padding:6px 12px;border-radius:18px;background:#1c2340;font-size:11px;color:#6b7aa0;cursor:pointer}.tab.active{background:#2a365c;color:#fff;border:1px solid #3b82f6}.chart{height:200px;background:#0e1429;position:relative;border-bottom:1px solid #1a2340}.ctop{display:flex;justify-content:space-between;padding:6px 8px}.vbox{background:#1c2340;padding:5px 8px;border-radius:9px;border:1px solid #243055;display:flex;gap:6px}.vsel{background:transparent;color:#fff;border:none;font-weight:700;font-size:11px}.zoom{position:absolute;left:6px;top:55px;display:flex;flex-direction:column;gap:6px;z-index:10}.zbtn{width:30px;height:30px;background:#1e2747;border:1px solid #2a365c;border-radius:7px;color:#fff}.chart canvas{width:100%;height:140px;display:block}.paxis{position:absolute;right:0;top:40px;bottom:15px;width:62px;display:flex;flex-direction:column;justify-content:space-between;padding:2px 4px;text-align:right;font-size:9px;color:#6b7aa0;background:rgba(14,20,41,.9)}.ldot{position:absolute;right:62px;background:#fff;color:#000;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:900;transform:translateY(-50%)}.digits{height:50px;display:flex;gap:3px;padding:4px;background:#151b2e;overflow-x:auto}.digit{flex:0 0 36px;display:flex;flex-direction:column;align-items:center}.dc{width:32px;height:32px;border-radius:50%;border:2px solid #2a365c;display:flex;align-items:center;justify-content:center;font-weight:800;background:#1e2747;font-size:12px}.dc.active{border-color:#3b82f6;background:#2a365c}.controls{flex:1;display:flex;flex-direction:column;gap:4px;padding:4px 8px 0;background:#0e1429}.am{height:32px;display:flex;background:#151b2e;border-radius:8px;padding:2px}.am button{flex:1;border:none;border-radius:6px;font-weight:800;background:transparent;color:#6b7aa0;font-size:11px}.am button.active{background:#3b82f6;color:#fff}.srow{display:flex;gap:6px}.sbox{flex:1;background:#151b2e;border:1.5px solid #2a5de8;border-radius:11px;height:38px;display:flex;justify-content:space-between;align-items:center;padding:0 8px}.sb{width:34px;height:34px;border-radius:9px;background:#1e2747;border:1px solid #2a365c;color:#fff}.sval{font-size:18px;font-weight:900}.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}.qb{background:#1e2747;border:1px solid #2a365c;padding:5px 1px;border-radius:7px;color:#6b7aa0;font-size:9px;font-weight:700}.qb.active{background:#2a365c;color:#3b82f6;border-color:#3b82f6}.extras{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.ex{background:#151b2e;border:1px solid #2a365c;border-radius:9px;padding:5px;text-align:center;height:38px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}.tbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;margin-bottom:18px}.tb{height:52px;border:none;border-radius:13px;padding:7px 10px;display:flex;flex-direction:column;justify-content:center}.even{background:#22c55e;color:#fff}.odd{background:#ef4444;color:#fff}.bottom{height:54px;background:#151b2e;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #1e2745}.nav{display:flex;flex-direction:column;align-items:center;font-size:9px;color:#5a6a8a;padding:3px 18px;border-radius:10px;cursor:pointer}.nav.active{color:#5a8bff;background:#1e2747}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.mbox{background:#151b2e;border:1px solid #2a365c;border-radius:18px;width:100%;max-width:350px;padding:14px}.mhead{display:flex;justify-content:space-between;margin-bottom:10px}.cls{width:30px;height:30px;background:#1e2747;border:none;border-radius:7px;color:#fff}.ig{margin:6px 0}.ig input{width:100%;background:#0a0e1a;border:1px solid #2a365c;padding:10px;border-radius:9px;color:#fff;margin-top:3px}.btn{width:100%;padding:11px;border:none;border-radius:10px;color:#fff;font-weight:800;margin-top:6px}</style></head><body>
<div class="banner"><b>Get Donschempro App</b><button onclick="alert('Chrome Menu > Install App')" style="background:#fff;color:#4a6cf7;padding:6px 12px;border-radius:18px;border:none;font-weight:800">Download</button></div>
<div class="header"><div style="display:flex;gap:7px;align-items:center"><i class="fas fa-bars" style="color:#8b9abf"></i><div style="width:32px;height:32px;background:#ff3b3b;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900">D</div><div style="background:#1e2747;padding:5px 10px;border-radius:20px;border:1px solid #2a365c"><span style="color:#3b82f6;font-weight:700;font-size:11px">$<span id="bal">0.03</span></span></div></div><button onclick="openM('dep')" style="background:#2a5de8;padding:6px 12px;border-radius:14px;border:none;color:#fff;font-weight:800">Deposit</button></div>
<div class="tabs"><div class="tab" onclick="setTab('matches')" id="t-matches">Matches/Differs</div><div class="tab active" onclick="setTab('even')" id="t-even">Even/Odd</div><div class="tab" onclick="setTab('over')" id="t-over">Over/Under</div></div>
<div class="chart"><div class="ctop"><div class="vbox"><select class="vsel" onchange="changeVol(this.value)"><option value="10">Vol 10</option><option value="25">Vol 25</option><option value="50">Vol 50</option><option value="75">Vol 75</option><option value="100">Vol 100</option></select><span id="priceTxt">9386.27</span></div><div id="volPct" style="background:#1c2340;padding:4px 6px;border-radius:7px;font-size:10px">100%</div></div><div class="zoom"><button class="zbtn" onclick="zoomChart(1)">+</button><button class="zbtn" onclick="zoomChart(-1)">-</button></div><canvas id="c"></canvas><div class="paxis" id="priceAxis"></div><div class="ldot" id="lastDot">9386.27</div></div>
<div class="digits" id="digits"></div>
<div class="controls"><div class="am"><button class="active" id="autoBtn" onclick="setMode('auto')">AUTO</button><button id="manualBtn" onclick="setMode('manual')">MANUAL</button></div><div class="srow"><button class="sb" onclick="chgStake(-1)">-</button><div class="sbox"><span style="color:#3b82f6;font-weight:800;font-size:9px">STAKE $</span><span class="sval" id="stakeVal">10</span></div><button class="sb" onclick="chgStake(1)">+</button></div><div class="quick"><button class="qb" onclick="setStake(1)">$1</button><button class="qb" onclick="setStake(5)">$5</button><button class="qb active" onclick="setStake(10)">$10</button><button class="qb" onclick="setStake(25)">$25</button><button class="qb" onclick="setStake(50)">$50</button><button class="qb" onclick="setStake(100)">$100</button></div><div class="extras"><div class="ex" onclick="openM('profit')"><small style="color:#22c55e">TARGET PROFIT</small><b id="tpVal">200</b></div><div class="ex" onclick="openM('loss')"><small style="color:#ef4444">STOP LOSS</small><b id="slVal">999</b></div><div class="ex" onclick="openM('mult')"><small style="color:#f59e0b">MULTIPLIER</small><b id="multVal">2</b></div></div><div class="tbtns" id="tradeBtns"></div></div>
<div class="bottom"><div class="nav active"><i class="fas fa-chart-bar" style="font-size:18px"></i>Trade</div><div class="nav" onclick="openM('pos')"><i class="far fa-clock" style="font-size:18px"></i>Positions</div></div><div class="modal" id="m-dep"><div class="mbox"><div class="mhead"><b>Deposit</b><button class="cls" onclick="closeM('dep')">X</button></div><div style="background:#0a0e1a;padding:10px;border-radius:10px;text-align:center"><small>Real</small><div style="font-size:20px;font-weight:800;color:#1ebe59">$<span id="bal2">0.03</span></div></div><div class="ig"><small>KES</small><input id="depAmt" type="number" value="100" oninput="depKes.innerText='= $'+(this.value/130).toFixed(2)"><div id="depKes" style="font-size:10px;color:#22c55e">= $0.77</div></div><button class="btn" style="background:#1ebe59" onclick="doDep()">Deposit</button></div></div>
<div class="modal" id="m-with"><div class="mbox"><div class="mhead"><b>Withdraw</b><button class="cls" onclick="closeM('with')">X</button></div><div style="background:#0a0e1a;padding:10px;border-radius:10px;text-align:center"><small>Available</small><div style="font-size:20px;color:#ef4444">$<span id="bal3">0.03</span></div></div><div class="ig"><small>Amount $</small><input id="withAmt" type="number" value="10" oninput="withKes.innerText='= KES '+(this.value*130)"><div id="withKes" style="font-size:10px;color:#ef4444">= KES 1300</div></div><button class="btn" style="background:#ef4444" onclick="doWith()">Withdraw</button></div></div>
<div class="modal" id="m-profit"><div class="mbox"><div class="mhead"><b>Target Profit</b><button class="cls" onclick="closeM('profit')">X</button></div><div class="ig"><input id="inputTP" type="number" value="200"></div><button class="btn" style="background:#22c55e" onclick="tpVal.innerText=inputTP.value;closeM('profit')">Save</button></div></div>
<div class="modal" id="m-loss"><div class="mbox"><div class="mhead"><b>Stop Loss</b><button class="cls" onclick="closeM('loss')">X</button></div><div class="ig"><input id="inputSL" type="number" value="999"></div><button class="btn" style="background:#ef4444" onclick="slVal.innerText=inputSL.value;closeM('loss')">Save</button></div></div>
<div class="modal" id="m-mult"><div class="mbox"><div class="mhead"><b>Multiplier</b><button class="cls" onclick="closeM('mult')">X</button></div><div class="ig"><input id="inputMult" type="number" value="2"></div><button class="btn" style="background:#f59e0b" onclick="multVal.innerText=inputMult.value;closeM('mult')">Save</button></div></div>
<div class="modal" id="m-pos"><div class="mbox"><div class="mhead"><b>Positions</b><button class="cls" onclick="closeM('pos')">X</button></div><div id="posList" style="text-align:center;color:#6b7aa0">No positions</div></div></div>
<script>
let stake=10,bal=0.03,demoBal=10000,isReal=true,last=4,cnts=[11,11,11,11,11,11],pts=[],price=9385,zoomLevel=1,volMult=1,currentTab='even';
let cv=document.getElementById('c'),ctx=cv.getContext('2d');
function updBal(){let b=isReal?bal:demoBal;balEl=document.getElementById('bal');if(balEl)balEl.innerText=b.toFixed(2);document.getElementById('bal2').innerText=b.toFixed(2);document.getElementById('bal3').innerText=b.toFixed(2)}
function changeVol(v){volMult=v==10?1:v==25?2.5:v==50?5:v==75?7.5:10;document.getElementById('volPct').innerText=(volMult*20)+'%';pts=[];price=9380+Math.random()*10;for(let i=0;i<60;i++){price+=(Math.random()-0.5)*volMult;pts.push(price)}}
function zoomChart(d){zoomLevel=Math.max(0.5,Math.min(3,zoomLevel+d*0.3));draw()}
function resize(){cv.width=cv.offsetWidth*2;cv.height=280;draw()}window.addEventListener('resize',resize)
function renderDigits(){let d=document.getElementById('digits');d.innerHTML='';for(let i=0;i<10;i++){let ac=i===last?'active':'';d.innerHTML+=`<div class="digit"><div class="dc ${ac}">${i}</div><div style="font-size:7px;color:#6b7aa0">${cnts[i].toFixed(1)}%</div></div>`}}
function draw(){if(pts.length<2)return;let min=Math.min(...pts)-4/zoomLevel,max=Math.max(...pts)+4/zoomLevel;ctx.clearRect(0,0,cv.width,cv.height);ctx.beginPath();ctx.strokeStyle='#fff';ctx.lineWidth=2.5;pts.forEach((pt,i)=>{let x=i/pts.length*(cv.width-120);let y=cv.height-(pt-min)/(max-min)*cv.height*0.7-cv.height*0.15;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();let ly=cv.height-(pts[pts.length-1]-min)/(max-min)*cv.height*0.7-cv.height*0.15;document.getElementById('lastDot').style.top=ly/2+'px';let ps=document.getElementById('priceAxis');ps.innerHTML='';let st=(max-min)/4;for(let i=0;i<5;i++){ps.innerHTML+=`<span>${(max-i*st).toFixed(2)}</span>`}}
function tick(){price+=(Math.random()-0.5)*volMult;pts.push(price);if(pts.length>80)pts.shift();last=Math.abs(Math.floor(price))%10;document.getElementById('priceTxt').innerText=price.toFixed(2);document.getElementById('lastDot').innerText=price.toFixed(2);renderDigits();draw()}
function chgStake(d){stake=Math.max(1,stake+d);upd();updateTradeBtns()}
function setStake(v){stake=v;upd();updateTradeBtns()}
function upd(){document.getElementById('stakeVal').innerText=stake;document.querySelectorAll('.qb').forEach(b=>{b.classList.toggle('active',b.innerText=='$'+stake)})}
function updateTradeBtns(){let pay=(stake*1.952).toFixed(2);let payHigh=(stake*8).toFixed(2);if(currentTab==='even'){tradeBtns.innerHTML=`<button class="tb even" onclick="trade('Even')"><b>Even $${pay}</b><small>95.2%</small></button><button class="tb odd" onclick="trade('Odd')"><b>Odd $${pay}</b><small>95.2%</small></button>`}else if(currentTab==='over'){tradeBtns.innerHTML=`<button class="tb even" onclick="trade('Over')"><b>Over $${pay}</b><small>95.2%</small></button><button class="tb odd" onclick="trade('Under')"><b>Under $${pay}</b><small>95.2%</small></button>`}else{tradeBtns.innerHTML=`<button class="tb even" onclick="trade('Matches')"><b>Matches $${payHigh}</b><small>800%</small></button><button class="tb odd" onclick="trade('Differs')"><b>Differs $${pay}</b><small>90%</small></button>`}}
function setMode(m){autoBtn.classList.toggle('active',m==='auto');manualBtn.classList.toggle('active',m!=='auto')}
function trade(t){let cur=isReal?bal:demoBal;if(cur<stake){alert('Insufficient');return}let win=false;if(t==='Even')win=last%2==0;if(t==='Odd')win=last%2==1;if(t==='Over')win=last>4;if(t==='Under')win=last<=4;if(t==='Matches')win=last==5;if(t==='Differs')win=last!=5;if(isReal)bal=win?bal+stake*0.952:bal-stake;else demoBal=win?demoBal+stake*0.952:demoBal-stake;updBal();let pay=t==='Matches'?stake*8:stake*0.952;posList.innerHTML=`<div style="background:#1e2747;padding:8px;border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between"><b>${t}</b><b style="color:${win?'#22c55e':'#ef4444'}">${win?'+$'+pay.toFixed(2):'-$'+stake}</b></div>`+posList.innerHTML}
function setTab(t){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('t-'+t).classList.add('active');currentTab=t;updateTradeBtns()}
function openM(id){document.getElementById('m-'+id).classList.add('show')}function closeM(id){document.getElementById('m-'+id).classList.remove('show')}
function doDep(){let amt=parseFloat(depAmt.value)||0;closeM('dep');setTimeout(()=>{bal+=amt/130;updBal();alert('Deposited $'+(amt/130).toFixed(2))},500)}
function doWith(){let amt=parseFloat(withAmt.value)||0;if(bal<amt){alert('Insufficient');return}closeM('with');setTimeout(()=>{bal-=amt;updBal();alert('Withdraw $'+amt)},500)}
for(let i=0;i<60;i++){price+=(Math.random()-0.5)*volMult;pts.push(price)}renderDigits();upd();updBal();updateTradeBtns();resize();setInterval(tick,900)
</script></body></html>
