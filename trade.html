<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TagOption Clone</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0e1f;color:#fff;min-height:100vh;display:flex;flex-direction:column}
.banner{background:linear-gradient(90deg,#1a4bd8,#2a7fff);padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.header{height:58px;background:#12182f;display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-bottom:1px solid #1e2747}
.logo{width:40px;height:40px;background:#ff3b3b;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900}
.real-box{background:#1c2340;padding:6px 14px;border-radius:20px;display:flex;gap:8px;align-items:center;border:1px solid #243055}
.tabs{display:flex;gap:10px;padding:12px 14px;background:#0e1320;overflow-x:auto}
.tab{padding:10px 18px;border-radius:24px;background:#1c2340;font-size:14px;color:#6b7aa0;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab.active{background:#2a344f;color:#fff}
.chart-area{background:#0e1320;position:relative}
.chart-header{display:flex;justify-content:space-between;padding:10px 14px}
.vol-box{background:#1c2340;padding:8px 14px;border-radius:14px;display:flex;gap:10px;border:1px solid #243055}
.vol-box select{background:transparent;color:#fff;border:none;font-weight:700;outline:none}
canvas{width:100%;height:240px;display:block;background:#0e1320}
.price-scale{position:absolute;right:0;top:60px;bottom:30px;width:70px;display:flex;flex-direction:column;justify-content:space-between;padding:10px 8px;text-align:right;font-size:11px;color:#6b7aa0}
.time-scale{display:flex;justify-content:space-between;padding:6px 80px 6px 50px;font-size:11px;color:#6b7aa0}
.plusminus{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
.pm-btn{width:36px;height:36px;background:#1c2340;border:1px solid #2a3a62;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center}
.last-price{position:absolute;right:70px;background:#00d4ff;color:#000;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:800;transform:translateY(-50%)}
.digits{display:flex;gap:8px;padding:12px 14px;background:#12182f;overflow-x:auto;border-top:1px solid #1e2747}
.digit{flex:0 0 52px;display:flex;flex-direction:column;align-items:center;gap:4px}
.digit-circle{width:44px;height:44px;border-radius:50%;border:2px solid #243055;display:flex;align-items:center;justify-content:center;font-weight:800;background:#1c2340}
.digit-circle.active{border-color:#3b82f6}
.controls{background:#0a0e1f;padding:14px;display:flex;flex-direction:column;gap:14px}
.am{display:flex;background:#12182f;border-radius:12px;padding:3px;border:1px solid #1e2747}
.am button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:800;background:transparent;color:#6b7aa0}
.am button.active{background:#2a7fff;color:#fff}
.stake-box{background:#12182f;border:1px solid #2a7fff;border-radius:20px;padding:12px 16px;text-align:center}
.stake-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.stake-btn{width:44px;height:44px;border-radius:12px;background:#1c2340;border:1px solid #243055;color:#fff;font-size:22px}
.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.quick button{background:#1c2340;border:1px solid #243055;padding:12px 2px;border-radius:12px;color:#6b7aa0;font-weight:700}
.quick button.active{background:#2a344f;color:#fff;border-color:#3b82f6}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.three-box{background:#12182f;border:1px solid #243055;border-radius:16px;padding:12px;text-align:center}
.eo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.eo button{padding:16px 18px;border:none;border-radius:18px;text-align:left}
.even{background:#22c55e;color:#fff}.odd{background:#ef4444;color:#fff}
.bottom{height:70px;background:#12182f;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #1e2747;position:sticky;bottom:0}
.bottom-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#6b7aa0}
.bottom-item.active{color:#5a8bff}
.ai-icon{width:44px;height:44px;background:linear-gradient(135deg,#f59e0b,#ec4899);border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff}
</style></head><body>
<div class="banner"><div style="display:flex;gap:12px;align-items:center"><div style="width:44px;height:44px;background:rgba(255,255,255,.15);border-radius:12px;display:flex;align-items:center;justify-content:center"><i class="fas fa-download"></i></div><div><b>Get the TagOption App</b><br><small style="opacity:.9">Get a better trading experience</small></div></div><div style="display:flex;gap:10px;align-items:center"><button style="background:#fff;color:#1a4bd8;padding:10px 22px;border-radius:24px;border:none;font-weight:800">Download</button>✕</div></div>
<div class="header"><div style="display:flex;gap:14px;align-items:center"><i class="fas fa-bars" style="font-size:22px;color:#8b9abf"></i><div class="logo">T</div><div class="real-box"><div style="width:30px;height:30px;background:#3b82f6;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px">R</div><span style="color:#3b82f6;font-weight:700">$ <span id="bal">0.03</span> <i class="fas fa-chevron-down" style="font-size:10px"></i></span></div></div><div style="display:flex;gap:16px;align-items:center"><i class="fas fa-volume-up" style="color:#6b7aa0"></i><button style="background:#2a5de8;padding:10px 22px;border-radius:20px;border:none;color:#fff;font-weight:800">Deposit</button><i class="far fa-bell" style="color:#6b7aa0;font-size:18px"></i></div></div>
<div class="tabs"><div class="tab"><i class="far fa-dot-circle"></i> Matches/Differs</div><div class="tab active"><i class="fas fa-th"></i> Even/Odd</div><div class="tab"><i class="fas fa-arrows-alt-v"></i> Over/Under</div></div>
<div class="chart-area"><div class="chart-header"><div class="vol-box"><i class="fas fa-chart-bar" style="color:#3b82f6"></i><div><select id="volSel" onchange="changeVol(this.value)"><option selected>Vol 10 (1s)</option><option>Vol 25 (1s)</option><option>Vol 50 (1s)</option><option>Vol 75 (1s)</option><option>Vol 100 (1s)</option></select><div><small id="vPrice" style="color:#ff6b6b">9430.09 -0.74%</small></div></div></div><div style="background:#1c2340;padding:8px 16px;border-radius:12px;font-size:14px;border:1px solid #243055;color:#8b9abf">100%</div></div>
<div style="position:relative"><canvas id="c"></canvas><div class="plusminus"><div class="pm-btn">+</div><div class="pm-btn">−</div></div><div class="price-scale"><span>9456.57</span><span>9447.58</span><span>9438.58</span><span>9430.09</span></div><div class="last-price" id="lastPrice">9430.09</div></div>
<div class="time-scale"><span>14:53:45</span><span>14:54:06</span><span>14:54:21</span><span>14:54:30</span><span>14:54:35</span></div>
<div class="digits" id="digits"></div></div>
<div class="controls"><div class="am"><button class="active" id="aBtn" onclick="setM('a')">AUTO</button><button id="mBtn" onclick="setM('m')">MANUAL</button></div>
<div class="stake-box"><small style="color:#3b82f6;font-weight:800;letter-spacing:1px">STAKE</small><div class="stake-row"><button class="stake-btn" onclick="adj(-1)">−</button><div><span style="color:#3b82f6">$</span> <b style="font-size:32px" id="stk">10</b></div><button class="stake-btn" onclick="adj(1)">+</button></div></div>
<div class="quick"><button onclick="setS(1)">$1</button><button onclick="setS(5)">$5</button><button class="active" onclick="setS(10)">$10</button><button onclick="setS(25)">$25</button><button onclick="setS(50)">$50</button><button onclick="setS(100)">$100</button></div>
<div class="three"><div class="three-box"><small style="color:#22c55e">TARGET PROFIT</small><div><span style="color:#6b7aa0">$</span> <b>200</b></div></div><div class="three-box"><small style="color:#ef4444">STOP LOSS</small><div><span style="color:#6b7aa0">$</span> <b>999</b></div></div><div class="three-box"><small style="color:#f59e0b">MULTIPLIER</small><div><span style="color:#6b7aa0">x</span> <b>2</b></div></div></div>
<div class="eo"><button class="even" onclick="trade('Even')"><div style="display:flex;justify-content:space-between"><b>Even</b><b id="ePay">$19.52</b></div><div style="display:flex;justify-content:space-between;margin-top:4px"><small>95.2%</small><small>Payout</small></div></button><button class="odd" onclick="trade('Odd')"><div style="display:flex;justify-content:space-between"><b>Odd</b><b id="oPay">$19.52</b></div><div style="display:flex;justify-content:space-between;margin-top:4px"><small>95.2%</small><small>Payout</small></div></button></div></div>
<div class="bottom"><div class="bottom-item active"><i class="fas fa-chart-bar" style="font-size:22px"></i>Trade</div><div class="bottom-item"><div class="ai-icon"><i class="fas fa-sparkles"></i></div><span style="color:#ec4899;font-weight:700;margin-top:4px">AI</span></div><div class="bottom-item"><i class="far fa-clock" style="font-size:22px"></i>Positions</div></div>
<script>
let stake=10,bal=0.03,last=7,cnts=[11.4,8.4,10.0,9.0,11.0,10.6,10.8,8.0,9.8,11.0],pts=[],price=9430.09,mult=1;
let canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
function resize(){canvas.width=canvas.offsetWidth*2;canvas.height=480;draw();}
window.addEventListener('resize',resize);
function renderDigits(){let d=document.getElementById('digits');d.innerHTML='';for(let i=0;i<10;i++){let p=cnts[i].toFixed(1);let ac=i==last?' active':'';d.innerHTML+='<div class="digit"><div class="digit-circle'+ac+'" style="border-top-color:'+(i%2==0?'#22c55e':'#ef4444')+'">'+i+'</div><small>'+p+'%</small></div>';}}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#1c2340';for(let i=0;i<4;i++){let y=canvas.height/4*i;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width-140,y);ctx.stroke();}ctx.beginPath();ctx.strokeStyle='#fff';ctx.lineWidth=3;pts.forEach((pt,idx)=>{let x=idx/pts.length*(canvas.width-140);let y=canvas.height-(pt-9420)/40*canvas.height;if(idx==0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();}
function tick(){price+=(Math.random()-0.5)*1.2*mult;pts.push(price);if(pts.length>80)pts.shift();last=Math.abs(Math.floor(price))%10;cnts[last]+=0.2;let s=cnts.reduce((a,b)=>a+b,0);cnts=cnts.map(v=>v/s*100);let ch=(Math.random()*1.5-0.75).toFixed(2);document.getElementById('vPrice').innerHTML=price.toFixed(2)+' <span style="color:'+(ch>0?'#22c55e':'#ef4444')+'">'+ch+'%</span>';document.getElementById('lastPrice').innerText=price.toFixed(2);renderDigits();draw();}
function changeVol(v){if(v.includes('10'))mult=1;else if(v.includes('25'))mult=2.5;else if(v.includes('50'))mult=5;else if(v.includes('75'))mult=7.5;else mult=10;pts=[];}
function adj(d){stake=Math.max(1,stake+d);updateStake();}
function setS(v){stake=v;updateStake();}
function updateStake(){document.getElementById('stk').innerText=stake;let p=(stake*1.952).toFixed(2);document.getElementById('ePay').innerText='$'+p;document.getElementById('oPay').innerText='$'+p;document.querySelectorAll('.quick button').forEach(b=>{b.classList.toggle('active',b.innerText=='$'+stake);});}
function setM(m){document.getElementById('aBtn').classList.toggle('active',m=='a');document.getElementById('mBtn').classList.toggle('active',m=='m');}
function trade(t){let win=(last%2==0&&t=='Even')||(last%2==1&&t=='Odd');if(win)bal+=stake*0.952;else bal-=stake;document.getElementById('bal').innerText=bal.toFixed(2);let btn=document.querySelector(t=='Even'?'.even':'.odd');let orig=btn.innerHTML;btn.innerHTML='<b>'+(win?'WIN +$'+(stake*0.952).toFixed(2):'LOSS -$'+stake)+'</b>';setTimeout(()=>{btn.innerHTML=orig;updateStake();},1500);}
for(let i=0;i<60;i++){price+=(Math.random()-0.5)*0.8;pts.push(price);}renderDigits();updateStake();resize();setInterval(tick,1000);
</script></body></html>
