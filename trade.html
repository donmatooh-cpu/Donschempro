<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TagOption</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#080c1a;color:#fff;display:flex;flex-direction:column;min-height:100vh}.banner{background:#2a5de8;padding:10px;display:flex;justify-content:space-between}.head{background:#12182f;padding:10px;display:flex;justify-content:space-between;border-bottom:1px solid #243055}.tabs{display:flex;gap:8px;padding:10px;background:#12182f}.tabs div{background:#1c2340;padding:8px 14px;border-radius:20px;font-size:13px;color:#6b7aa0}.tabs div.on{background:#232f56;color:#fff}.chart{background:#0e1430;padding:10px}canvas{width:100%;height:200px;background:#0e1430;display:block}.digits{display:flex;gap:5px;padding:10px;background:#12182f;overflow:auto}.digits div{min-width:38px;background:#1c2340;text-align:center;padding:6px;border-radius:10px;border:1px solid #243055}.digits div.on{border:2px solid #3b82f6}.box{background:#12182f;margin:10px;padding:12px;border-radius:16px;border:1px solid #243055}.btns{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px}.btns button{background:#1c2340;color:#6b7aa0;border:1px solid #243055;padding:8px;border-radius:10px}.btns button.on{background:#1e2f5a;color:#fff}.eo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px}.eo button{padding:18px;border:none;border-radius:16px;font-weight:800}.even{background:#22c55e;color:#fff}.odd{background:#ef4444;color:#fff}</style></head><body>
<div class="banner"><b>Get TagOption App</b><button style="background:#fff;color:#2a5de8;padding:6px 16px;border-radius:20px;border:none;font-weight:800">Download</button></div>
<div class="head"><div>☰ T <span style="background:#1c2340;padding:6px 10px;border-radius:10px;color:#3b82f6">$ <span id="bal">0.03</span></span></div><div><button style="background:#2a5de8;color:#fff;padding:8px 16px;border:none;border-radius:10px">Deposit</button></div></div>
<div class="tabs"><div>Matches</div><div class="on">Even/Odd</div><div>Over/Under</div></div>
<div class="chart"><div style="display:flex;justify-content:space-between"><div style="background:#1c2340;padding:8px 12px;border-radius:12px"><select id="vol" onchange="chg(this.value)" style="background:transparent;color:#fff;border:none;font-weight:700"><option>Vol 10</option><option>Vol 25</option><option>Vol 50</option><option selected>Vol 75</option><option>Vol 100</option></select><br><small id="price" style="color:#ff6b6b">9355.35</small></div><div style="background:#1c2340;padding:8px 12px;border-radius:10px">100%</div></div><canvas id="c"></canvas><div class="digits" id="digits"></div></div>
<div class="box" style="text-align:center"><small style="color:#3b82f6">STAKE</small><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><button onclick="adj(-1)" style="width:36px;height:36px;border-radius:10px;background:#1c2340;color:#fff;border:1px solid #243055">-</button><b id="stk" style="font-size:32px">10</b><button onclick="adj(1)" style="width:36px;height:36px;border-radius:10px;background:#1c2340;color:#fff;border:1px solid #243055">+</button></div></div>
<div class="btns"><button onclick="setS(1)">$1</button><button onclick="setS(5)">$5</button><button class="on" onclick="setS(10)">$10</button><button onclick="setS(25)">$25</button><button onclick="setS(50)">$50</button><button onclick="setS(100)">$100</button></div>
<div class="box" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center"><div><small style="color:#22c55e">TARGET</small><br>$200</div><div><small style="color:#ef4444">STOP LOSS</small><br>$999</div><div><small style="color:#f59e0b">MULTI</small><br>x2</div></div>
<div class="eo"><button class="even" onclick="tr('Even')">Even<br><small id="ePay">$19.52</small></button><button class="odd" onclick="tr('Odd')">Odd<br><small id="oPay">$19.52</small></button></div>
<script>
let stake=10,bal=0.03,last=5,cnts=Array(10).fill(10),pts=[],price=9355.35,mult=7.5;
let cv=document.getElementById('c'),ctx=cv.getContext('2d');
function rs(){cv.width=cv.offsetWidth*2;cv.height=400;draw();}
function dig(){let d=document.getElementById('digits');d.innerHTML='';for(let i=0;i<10;i++){let p=cnts[i].toFixed(1),col=i%2==0?'#22c55e':'#ef4444';d.innerHTML+='<div id="d'+i+'"><b>'+i+'</b><br><small>'+p+'%</small><div style="background:'+col+';height:3px;width:'+p+'%;margin-top:3px;border-radius:2px"></div></div>';}document.getElementById('d'+last).classList.add('on');}
function draw(){ctx.clearRect(0,0,cv.width,cv.height);ctx.strokeStyle='#1c2340';for(let i=0;i<4;i++){let y=cv.height/4*i;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke();}ctx.beginPath();ctx.strokeStyle='#fff';ctx.lineWidth=3;pts.forEach((p,i)=>{let x=i/pts.length*cv.width,y=cv.height-(p-9300)/150*cv.height;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();}
function tick(){price+=(Math.random()-0.5)*3*mult;pts.push(price);if(pts.length>70)pts.shift();last=Math.abs(Math.floor(price))%10;cnts[last]+=0.5;let s=cnts.reduce((a,b)=>a+b,0);cnts=cnts.map(v=>v/s*100);document.getElementById('price').innerHTML=price.toFixed(2);dig();draw();}
function chg(v){if(v.includes('10'))mult=1;else if(v.includes('25'))mult=2.5;else if(v.includes('50'))mult=5;else if(v.includes('75'))mult=7.5;else mult=10;pts=[];}
function adj(d){stake=Math.max(1,stake+d);up();}
function setS(v){stake=v;up();}
function up(){document.getElementById('stk').innerText=stake;let p=(stake*1.952).toFixed(2);document.getElementById('ePay').innerText='$'+p;document.getElementById('oPay').innerText='$'+p;document.querySelectorAll('.btns button').forEach(b=>{b.classList.toggle('on',b.innerText=='$'+stake);});}
function tr(t){let w=(last%2==0&&t=='Even')||(last%2==1&&t=='Odd');if(w)bal+=stake*0.952;else bal-=stake;document.getElementById('bal').innerText=bal.toFixed(2);let btn=document.querySelector(t=='Even'?'.even':'.odd');let o=btn.innerHTML;btn.innerHTML=w?'WIN!':'LOSS';setTimeout(()=>{btn.innerHTML=o;up();},1200);}
for(let i=0;i<50;i++){price+=(Math.random()-0.5)*2;pts.push(price);}dig();up();rs();setInterval(tick,1000);
</script></body></html>
