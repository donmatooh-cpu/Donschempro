<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade | Donschempro</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Space Grotesk',sans-serif}
body{background:#070a14;color:#fff}
nav{display:flex;justify-content:space-between;padding:18px 24px;background:#0d1225;border-bottom:1px solid #1e2a4a;align-items:center}
.logo{font-weight:700;font-size:22px}.logo span{color:#3b82f6}
.btn{background:#3b82f6;color:#fff;padding:10px 20px;border-radius:10px;border:none;font-weight:700}
.hero{padding:20px}
.card{background:#10172f;border:1px solid #1e2a4a;border-radius:18px;padding:16px;margin-bottom:16px}
#tv_chart{height:420px;border-radius:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{font-size:12px;color:#8b9bb4}.val{font-size:18px;font-weight:700;margin-top:4px}
.green{color:#22c55e}
.trade-box{display:flex;gap:10px;margin-top:14px}
.trade-box button{flex:1;padding:16px;border-radius:12px;border:none;font-weight:800;font-size:16px}
.buy{background:#22c55e;color:#000}.sell{background:#ef4444;color:#fff}
input{width:100%;background:#0a1024;border:1px solid #1e2a4a;border-radius:10px;padding:14px;color:#fff;margin-top:10px}
</style>
</head>
<body>
<nav><div class="logo">DONSCHEM<span>PRO</span></div><a href="index.html"><button class="btn">Home</button></a></nav>
<div class="hero">
<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><h3>BTC/USDT • BINANCE</h3><span class="green">● LIVE</span></div><div id="tv_chart"></div></div>
<div class="grid">
<div class="card"><div class="stat">BALANCE</div><div class="val">$12,450.00</div><div class="stat green">+ $340.20 today</div></div>
<div class="card"><div class="stat">PnL (24h)</div><div class="val green">+5.42%</div><div class="stat">Win Rate 78%</div></div>
</div>
<div class="card">
<h3>Quick Trade</h3>
<input id="amount" type="number" value="100" placeholder="Amount USDT">
<div class="trade-box"><button class="buy" onclick="trade('BUY')">LONG / BUY</button><button class="sell" onclick="trade('SELL')">SHORT / SELL</button></div>
<p id="msg" style="margin-top:12px;color:#8b9bb4;font-size:13px;text-align:center">Select amount and trade. Demo mode.</p>
</div>
</div>
<script>
new TradingView.widget({"autosize":true,"symbol":"BINANCE:BTCUSDT","interval":"15","timezone":"Africa/Nairobi","theme":"dark","style":"1","locale":"en","toolbar_bg":"#10172f","enable_publishing":false,"hide_top_toolbar":false,"save_image":false,"container_id":"tv_chart"});
function trade(side){const amt=document.getElementById('amount').value;document.getElementById('msg').innerHTML=`✅ ${side} ${amt} USDT executed! (Demo)`;document.getElementById('msg').style.color='#fff'}
</script>
</body>
</html>
