*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0e1429;color:#fff;max-width:500px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.banner{background:linear-gradient(90deg,#4a6cf7,#6a8cff);height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 10px;flex-shrink:0}

.am{height:30px;display:flex;background:#151b2e;border-radius:8px;padding:2px;border:1px solid #1e2745;flex-shrink:0}

.am button.active{background:#3b82f6;color:#fff}
.stake-row{display:flex;gap:6px;align-items:center;flex-shrink:0}
.stake-box{flex:1;background:#151b2e;border:1.5px solid #2a5de8;border-radius:10px;height:36px;display:flex;justify-content:space-between;align-items:center;padding:0 8px}
.s-btn{width:32px;height:32px;border-radius:8px;background:#1e2747;border:1px solid #2a365c;color:#fff}
.stake-val{font-size:17px;font-weight:900}
.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;flex-shrink:0}
.q-btn{background:#1e2747;border:1px solid #2a365c;padding:4px 1px;border-radius:6px;color:#6b7aa0;font-size:9px;font-weight:700}
.q-btn.active{background:#2a365c;color:#3b82f6;border-color:#3b82f6}
.extras{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;flex-shrink:0}
.ex-box{background:#151b2e;border:1px solid #2a365c;border-radius:8px;padding:4px;text-align:center;height:36px;display:flex;flex-direction:column;justify-content:center}
.ex-box small{font-size:7px;font-weight:800}
.ex-box b{font-size:11px}

</style></head><body>
