<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DON SCHEM PRO - Tag Option</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial}
body{background:#0e101e;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{height:50px;background:#181b32;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #232749}
.logo{font-weight:800;font-size:15px}.logo span{color:#3b82f6}
.mid{background:#212547;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:700}
.bal{background:#212547;padding:4px 10px;border-radius:8px;text-align:right}
.bal b{font-size:13px}
.main{flex:1;display:flex;overflow:hidden}
.chart-box{flex:1;position:relative;background:#0e101e}
#chart{width:100%;height:100%}
.timer{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);border:2px solid #3b82f6;padding:18px 28px;border-radius:50%;font-size:36px;font-weight:900;display:none;z-index:10}
.trades{height:80px;background:#181b32;border-top:1px solid #232749;display:flex;gap:8px;padding:8px;overflow-x:auto}
.right{width:300px;background:#181b32;border-left:1px solid #232749;padding:12px;display:flex;flex-direction:column;gap:10px;overflow-y:auto}
.box{background:#121426;border:1px solid #2a2f5a;border-radius:12px;padding:10px;display:flex;justify-content:space-between;align-items:center}
.box input{background:transparent;border:none;color:#fff;font-weight:800;font-size:20px;width:100px;outline:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid button{background:#121426;border:1px solid #2a2f5a;padding:10px;border-radius:10px;color:#7a85b5;font-weight:700;font-size:11px}
.grid button.active{background:#3b82f6;color:#fff}
.profit{background:#121426;border:1px dashed #3a3f6b;border-radius:12px;padding:12px;text-align:center}
.profit b{color:#22c55e;font-size:20px}
.btn{padding:14px;border:none;border-radius:12px;font-weight:800;font-size:15px}
.up{background:#22c55e}.down{background:#ef4444;color:#fff}
@media(max-width:800px){.main{flex-direction:column}.right{width:100%;height:48%}.chart-box{height:52%}}
</style>
</head>
<body>
<div class="top">
<div class="logo">DON SCHEM <span>PRO</span></div>
<div class="mid">EUR/USD OTC +92%</div>
<div class="bal"><small style="font-size:9px;color:#7a85b5">DEMO OTC</small><br><b id="bal">$12,450.00</b></div>
</div>
<div class="main">
<div class="chart-box"><div id="chart"></div><div class="timer" id="tmr"></div><div class="trades" id="trades"><small style="color:#6a85b5">No trades - Place UP or DOWN kama Tag Option</small></div></div>
<div class="right">
<div><small style="color:#6a78a8;font-size:10px;font-weight:700">TRADING AMOUNT (KSH)</small><div class="box"><span>KSh</span><input id="amt" value="1000" type="number"><div><button onclick="adj(-100)" style="width:32px;height:32px;background:#212547;border:1px solid #2d335a;color:#fff;border-radius:8px">-</button><button onclick="adj(100)" style="width:32px;height:32px;background:#212547;border:1px solid #2d335a;color:#fff;border-radius:8px">+</button></div></div></div>
<div><small style="color:#6a78a8;font-size:10px;font-weight:700">EXPIRY TIME - TAG OPTION</small><div class="grid"><button onclick="st(this,5)">5s</button><button onclick="st(this,15)">15s</button><button class="active" onclick="st(this,30)">30s</button><button onclick="st(this,60)">1m</button><button onclick="st(this,120)">2m</button><button onclick="st(this,300)">5m</button><button onclick="st(this,600)">10m</button><button onclick="st(this,1800)">30m</button></div></div>
<div class="profit"><small style="color:#6a78a8;font-size:10px">POTENTIAL PROFIT</small><br><b id="pft">+ KSh 920 (92%)</b><br><small style="color:#6a78a8;font-size:9px">IF PRICE GOES YOUR WAY • OTC</small></div>
<button class="btn up" onclick="trade('UP')">↑ UP</button>
<button class="btn down" onclick="trade('DOWN')">↓ DOWN</button>
<small style="text-align:center;color:#6a78a8;font-size:10px">92% Payout • Same as Tag Option • DON SCHEM PRO</small>
</div>
</div>
<script>
let exp=30,bal=12450,price=1.12173;
let chart=LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#0e101e'},textColor:'#5a658f'},grid:{vertLines:{color:'#1a1e35'},horzLines:{color:'#1a1e35'}},rightPriceScale:{borderColor:'#232749'},timeScale:{borderColor:'#232749',timeVisible:true,secondsVisible:false}});
let series=chart.addCandlestickSeries({upColor:'#22c55e',downColor:'#ef4444',borderVisible:false,wickUpColor:'#22c55e',wickDownColor:'#ef4444'});
let data=[],t=Math.floor(Date.now()/1000)-200*5;
for(let i=0;i<200;i++){let o=price;price+=(Math.random()-0.5)*0.0004;let c=price;let h=Math.max(o,c)+(Math.random()*0.00015);let l=Math.min(o,c)-(Math.random()*0.00015);data.push({time:t,open:o,high:h,low:l,close:c});t+=5;}
series.setData(data);
function tick(){let last=data[data.length-1];price+=(Math.random()-0.5)*0.0005;let o=last.close,c=price,h=Math.max(o,c)+(Math.random()*0.0001),l=Math.min(o,c)-(Math.random()*0.0001);data.push({time:last.time+5,open:o,high:h,low:l,close:c});if(data.length>250)data.shift();series.setData(data);}
setInterval(tick,800);
function adj(v){let e=document.getElementById('amt');e.value=Math.max(100,parseInt(e.value)+v);calc();}
function st(el,s){document.querySelectorAll('.grid button').forEach(b=>b.classList.remove('active'));el.classList.add('active');exp=s;}
function calc(){let a=document.getElementById('amt').value;document.getElementById('pft').innerText='+ KSh '+(a*0.92).toFixed(0)+' (92%)';}
document.getElementById('amt').addEventListener('input',calc);
function trade(dir){let a=parseInt(document.getElementById('amt').value);let id=Date.now();let tr=document.getElementById('trades');if(tr.innerHTML.includes('No trades'))tr.innerHTML='';tr.innerHTML+=`<div id="c${id}" style="background:#212547;border:1px solid #2d335a;border-radius:10px;padding:8px;min-width:150px"><b style="font-size:12px">EUR/USD ${dir} KSh ${a}</b><br><small id="t${id}">${exp}s</small></div>`;let line=series.createPriceLine({price:price,color:dir=='UP'?'#22c55e':'#ef4444',lineWidth:1,lineStyle:2,title:dir});let c=exp;let tm=document.getElementById('tmr');tm.style.display='block';let iv=setInterval(()=>{c--;tm.innerText=c;let el=document.getElementById('t'+id);if(el)el.innerText=c+'s left';if(c<=0){clearInterval(iv);tm.style.display='none';let win=Math.random()>0.42;let card=document.getElementById('c'+id);if(win){bal+=a*0.92;card.innerHTML+=`<br><b style="color:#22c55e">WIN +${(a*0.92).toFixed(0)}</b>`}else{bal-=a;card.innerHTML+=`<br><b style="color:#ef4444">LOSS -${a}</b>`}document.getElementById('bal').innerText='$'+bal.toFixed(2);series.removePriceLine(line);setTimeout(()=>{if(card)card.remove()},3500);}},1000);}
calc();
</script>
</body>
</html>
